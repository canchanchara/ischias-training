<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Posen-Vorschau</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { padding: 12px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cell { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <!-- Zeigt jede Übung in Haltung A und B. Optional nur eine Übung: poses.html#bruecke -->
  <div class="grid" id="grid"></div>
  <script src="../js/exercises.js"></script>
  <script src="../js/figure.js"></script>
  <script>
    const only = location.hash.slice(1);
    for (const ex of Exercises.EXERCISES.filter((e) => !only || e.id === only)) {
      for (const mix of [0, 1]) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = ex.name + (mix ? ' (B)' : ' (A)');
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'figure');
        cell.appendChild(svg);
        document.getElementById('grid').appendChild(cell);
        Figure.snapshot(svg, ex, mix);
      }
    }
  </script>
</body>
</html>
